<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쉬는 시간 오목</title><meta name="description" content="친구와 방 코드로 만나는 온라인 오목"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234c5cf5'/%3E%3Ccircle cx='12' cy='12' r='7' fill='%23171c30'/%3E%3Ccircle cx='21' cy='21' r='7' fill='white'/%3E%3C/svg%3E"><style>
:root{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1c2238;background:#f4f5f9}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #4c5cf5;outline-offset:3px}main{max-width:1200px;margin:auto;padding:0 44px}header{height:100px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2e4ed}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;font-size:21px;font-weight:800;letter-spacing:-1px}.brand-sub{font-weight:400;color:#747b91}.logo{display:flex;position:relative;width:35px;height:35px}.logo i{position:absolute;width:24px;height:24px;background:#23283d;border-radius:50%;top:0;left:0}.logo i+i{background:white;border:1px solid #ccc;top:11px;left:11px}.header-note{font-size:14px;color:#747b91}.workspace{display:grid;grid-template-columns:minmax(0,660px) 310px;gap:56px;padding:38px 0}.play-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.eyebrow{font-size:12px;letter-spacing:2px;color:#798198;font-weight:700}h1{font-size:34px;margin:7px 0 0;letter-spacing:-1.5px}.moves{font-size:30px;font-weight:700;color:#8d93a4;font-variant-numeric:tabular-nums}.moves small{font-size:14px;font-weight:400}.board-shell{padding:21px;background:#ddae70;border-radius:10px;box-shadow:0 8px 24px #282b3e0b,inset 0 0 0 1px #b3865040}.board{position:relative;display:grid;grid-template-columns:repeat(15,1fr);aspect-ratio:1}.grid{position:absolute;width:100%;height:100%;pointer-events:none}.grid line{stroke:#7d5938;stroke-width:.19}.grid circle{fill:#7d5938}.intersection{background:transparent;border:0;padding:0;position:relative;display:flex;justify-content:center;align-items:center;aspect-ratio:1;z-index:1;touch-action:manipulation}.stone,.ghost{width:86%;height:86%;border-radius:50%;display:block;position:relative}.black{background:radial-gradient(circle at 35% 25%,#53565f,#141723 65%);box-shadow:1px 3px 4px #31251555}.white{background:radial-gradient(circle at 30% 20%,#fff,#e7e7ec 75%);box-shadow:1px 3px 4px #31251550}.stone.last:after{content:'';position:absolute;width:23%;height:23%;border-radius:50%;background:#7584ff;left:38.5%;top:38.5%}.ghost{opacity:0}.vacant:not(:disabled):hover .ghost{opacity:.4}.underboard{display:flex;justify-content:space-between;margin-top:15px;font-size:12px;color:#80869b}aside{padding-top:8px}.tabs{display:flex;background:#e7e9f1;padding:4px;border-radius:9px;gap:3px}.tabs button{flex:1;border:0;background:transparent;border-radius:6px;padding:11px 0;font-size:14px;color:#767e95;font-weight:600}.tabs .active{background:white;color:#404ed1;box-shadow:0 2px 4px #00000008}.status{padding:30px 0 24px;border-bottom:1px solid #e2e4ed}h2{font-size:23px;letter-spacing:-.8px;margin:10px 0}p{font-size:14px;line-height:1.8;color:#747b91;margin:0}.players{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:23px}.players>div{padding:15px 12px;border:1px solid #dde0ea;border-radius:8px;display:grid;grid-template-columns:28px 1fr;align-items:center;gap:4px 8px}.players .current{background:#eef0ff;border-color:#818bf4}.mini{width:25px;height:25px;border-radius:50%;grid-row:span 2}.players b{font-size:14px}.players small{font-size:12px;color:#7c8399}.room{padding-top:24px}.room strong{display:block;font-size:33px;letter-spacing:6px;margin:10px 0 18px}.primary,.join button{border:0;background:#4c5cf5;color:white;font-size:15px;font-weight:600;border-radius:8px;padding:14px}.primary{width:100%}.primary:hover{background:#3b49d2}.room p{font-size:12px;margin-top:12px}.divider{text-align:center;font-size:12px;color:#9298a9;margin:20px 0}.room label{font-size:14px;display:block;margin-bottom:8px}.join{display:flex;gap:8px}.join input{min-width:0;width:100%;padding:12px;border:1px solid #d6dae7;border-radius:8px;background:white;font-size:16px;letter-spacing:1px}.join button{flex-shrink:0}.restart{width:100%;border:1px solid #d5d9e5;background:white;padding:13px;border-radius:8px;font-size:14px;margin-top:20px;color:#424a64}.restart:disabled{opacity:.4}.rules{margin-top:31px;padding-top:22px;border-top:1px solid #e2e4ed}.rules h3{font-size:14px;margin:0 0 10px}.rules span{display:block;margin-top:13px;color:#8b91a3;font-size:12px}.error{color:#b43737;margin-top:14px}.primary:disabled,.join button:disabled{opacity:.5}footer{border-top:1px solid #e2e4ed;padding:20px 0 25px;font-size:12px;color:#9ba1b1}@media(min-width:1000px){.board-shell{max-width:620px}}@media(max-width:900px){main{padding:0 24px}.workspace{gap:26px;grid-template-columns:minmax(0,1fr) 270px}.board-shell{padding:15px}h1{font-size:28px}}@media(max-width:680px){main{padding:0 18px}header{height:74px}.header-note{display:none}.workspace{display:flex;flex-direction:column;padding-top:24px;gap:16px}.play-heading{margin-bottom:17px}h1{font-size:28px}.board-shell{padding:12px}.underboard{font-size:12px}aside{padding:0}.status{padding:21px 0}.players{margin-top:16px}.rules{margin-top:22px}.room{padding-top:20px}.tabs button{padding:13px}.brand{font-size:19px}footer{margin-top:14px}}
[hidden]{display:none!important}</style></head><body><main><header><a class="brand" href="./"><span class="logo"><i></i><i></i></span>쉬는 시간<span class="brand-sub">오목</span></a><span class="header-note">다섯 수로 만드는 한 판.</span></header><div class="workspace"><section class="play"><div class="play-heading"><div><span class="eyebrow">FIVE IN A ROW</span><h1>한 판 할래?</h1></div><span class="moves">00 <small>수</small></span></div><div class="board-shell"><div class="board"><svg viewBox="0 0 150 150" class="grid" aria-hidden="true"></svg></div></div><div class="underboard"><span>15 × 15</span><span>자유 오목 · 5개 이상 연속이면 승리</span></div></section><aside><div class="tabs"><button data-mode="ai">컴퓨터</button><button data-mode="online">친구와</button><button data-mode="local">둘이서</button></div><div class="status"><span class="eyebrow">YOUR GAME</span><h2 id="status" aria-live="polite"></h2><p id="desc"></p><div class="players"><div id="black-player"><span class="mini black"></span><b>흑</b><small>선공</small></div><div id="white-player"><span class="mini white"></span><b>백</b><small>후공</small></div></div></div><div class="room" id="online" hidden><div id="room-form"><button id="create" class="primary">새 방 만들기</button><div class="divider">또는 코드로 입장</div><label for="code">방 코드</label><div class="join"><input id="code" maxlength="6" placeholder="예: A3B8C1" autocomplete="off"><button id="join">입장</button></div></div><div id="room-info" hidden><span class="eyebrow">ROOM CODE</span><strong id="room-code"></strong><button id="copy" class="primary">초대 링크 복사</button><p>친구에게 링크 또는 방 코드를 보내세요.</p></div></div><p class="error" role="alert"></p><button class="restart" id="restart">새로 시작</button><div class="rules"><h3>간단한 규칙</h3><p>가로, 세로, 대각선으로 돌을 다섯 개 연결하면 이겨요. 흑이 먼저 놓고, 한 번 놓은 돌은 움직일 수 없어요.</p><span>삼삼·사사 금수 없는 자유 오목</span></div></aside></div><footer>잠깐의 한 판, 깔끔한 승부.</footer></main><script>const API='https://classroom-omok.q58d2hnmf7.chatgpt.site/api/game';
let b=Array(225).fill(0),turn=1,winner=0,last=-1,mode='ai',room=null,token='',busy=false,epoch=0;
const $=s=>document.querySelector(s);
function winning(b,i){const c=b[i],x=i%15,y=Math.floor(i/15);if(!c)return false;return [[1,0],[0,1],[1,1],[1,-1]].some(([dx,dy])=>{let n=1;for(const sign of [-1,1])for(let k=1;k<15;k++){const xx=x+dx*k*sign,yy=y+dy*k*sign;if(xx<0||xx>=15||yy<0||yy>=15||b[yy*15+xx]!==c)break;n++;}return n>=5;});}
function computer(b){const empty=b.map((v,i)=>v?-1:i).filter(i=>i>=0);for(const c of [2,1])for(const i of empty){b[i]=c;const w=winning(b,i);b[i]=0;if(w)return i;}let best=empty[0],score=-Infinity;for(const i of empty){const x=i%15,y=Math.floor(i/15);let s=-Math.hypot(x-7,y-7)*.1;for(const c of [2,1])for(const [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]){let n=0,open=0;for(const sign of [-1,1])for(let k=1;k<5;k++){const xx=x+dx*k*sign,yy=y+dy*k*sign;if(xx<0||xx>=15||yy<0||yy>=15)break;const v=b[yy*15+xx];if(v===c)n++;else{if(!v)open++;break;}}s+=Math.pow(8,n)*(open===2?2:open===1?1:0)*(c===1?1.1:1);}if(s>score){score=s;best=i;}}return best;}
async function api(payload,c=room?.code,t=token){const r=await fetch(payload?API:API+'?code='+c,{method:payload?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},...(payload?{body:JSON.stringify({...payload,code:payload.code||c})}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'연결을 확인해 주세요.');return d;}
function apply(d){room=d;b=d.board;turn=d.turn;winner=d.winner;last=d.last;render();}
function err(s){$('.error').textContent=s;}
function render(){const disabled=busy||winner||(mode==='ai'&&turn===2)||(mode==='online'&&(!room?.ready||room.color!==turn));document.querySelectorAll('.intersection').forEach((el,i)=>{el.disabled=!!disabled||!!b[i];el.innerHTML=b[i]?'<span class="stone '+(b[i]===1?'black':'white')+(last===i?' last':'')+'"></span>':'<span class="ghost '+(turn===1?'black':'white')+'"></span>';el.className='intersection'+(b[i]?'':' vacant');el.setAttribute('aria-label',`${Math.floor(i/15)+1}행 ${i%15+1}열 ${b[i]===1?'흑돌':b[i]===2?'백돌':'빈 자리'}`);});$('.moves').innerHTML=String(b.filter(Boolean).length).padStart(2,'0')+' <small>수</small>';$('#status').textContent=winner?(winner===3?'무승부!':(winner===1?'흑':'백')+' 승리!'):mode==='online'&&!room?'방을 만들거나 입장하세요':mode==='online'&&!room.ready?'친구를 기다리는 중':mode==='ai'&&turn===2?'컴퓨터가 생각하는 중…':mode==='online'&&room.color!==turn?'친구의 차례':(turn===1?'흑':'백')+'의 차례';$('#desc').textContent=mode==='ai'?'나는 흑, 컴퓨터는 백이에요.':mode==='local'?'한 화면에서 번갈아 돌을 놓으세요.':room?'나는 '+(room.color===1?'흑':'백')+'이에요.':'같은 방 코드로 만나세요.';document.querySelectorAll('.tabs button').forEach(el=>el.classList.toggle('active',el.dataset.mode===mode));$('#online').hidden=mode!=='online';$('#room-form').hidden=!!room;$('#room-info').hidden=!room;if(room)$('#room-code').textContent=room.code;$('#restart').disabled=busy||(mode==='online'&&(!room||!winner));$('#restart').textContent=winner?'한 판 더':'새로 시작';$('#black-player').classList.toggle('current',turn===1&&!winner);$('#white-player').classList.toggle('current',turn===2&&!winner);$('#join').disabled=busy||$('#code').value.trim().length!==6;$('#create').disabled=busy;}
function change(m){epoch++;mode=m;b=Array(225).fill(0);turn=1;winner=0;last=-1;room=null;token='';busy=false;err('');render();}
function localMove(i){b[i]=turn;last=i;winner=winning(b,i)?turn:b.every(Boolean)?3:0;turn=3-turn;render();}
async function move(i){if(busy||winner||b[i]||(mode==='ai'&&turn===2))return;if(mode==='online'){if(!room?.ready||room.color!==turn)return;busy=true;render();try{apply(await api({action:'move',index:i}));err('');}catch(e){err(e.message);}finally{busy=false;render();}return;}localMove(i);if(mode==='ai'&&!winner){const e=epoch;setTimeout(()=>{if(e!==epoch||mode!=='ai'||turn!==2)return;localMove(computer(b));},420);}}
async function connect(action){busy=true;render();try{const d=await api({action,code:$('#code').value.trim().toUpperCase()});token=d.token;apply(d);err('');}catch(e){err(e.message);}finally{busy=false;render();}}
$('#create').onclick=()=>connect('create');$('#join').onclick=()=>connect('join');$('#code').oninput=()=>{$('#code').value=$('#code').value.toUpperCase();render();};$('#code').onkeydown=e=>{if(e.key==='Enter'&&!$('#join').disabled)connect('join');};
$('#copy').onclick=async()=>{const u=new URL(location.href);u.search='?room='+room.code;try{await navigator.clipboard.writeText(u.href);$('#copy').textContent='링크 복사 완료!';setTimeout(()=>$('#copy').textContent='초대 링크 복사',2000);}catch{err('방 코드 '+room.code+'를 친구에게 알려 주세요.');}};
$('#restart').onclick=async()=>{epoch++;if(mode==='online'){busy=true;try{await api({action:'reset'});apply(await api());}catch(e){err(e.message);}finally{busy=false;render();}}else{b=Array(225).fill(0);turn=1;winner=0;last=-1;render();}};
document.querySelectorAll('.tabs button').forEach(el=>el.onclick=()=>change(el.dataset.mode));
setInterval(async()=>{if(mode!=='online'||!room||!token||busy)return;const e=epoch;try{const d=await api();if(epoch===e){apply(d);err('');}}catch(ex){if(epoch===e)err(ex.message);}},1200);
const grid=$('.grid');for(let i=0;i<15;i++){grid.innerHTML+=`<line x1="5" y1="${5+i*10}" x2="145" y2="${5+i*10}"/><line y1="5" x1="${5+i*10}" y2="145" x2="${5+i*10}"/>`;}for(const y of [3,7,11])for(const x of [3,7,11])grid.innerHTML+=`<circle cx="${5+x*10}" cy="${5+y*10}" r=".65"/>`;for(let i=0;i<225;i++){const el=document.createElement('button');el.className='intersection vacant';el.onclick=()=>move(i);$('.board').append(el);}const param=new URLSearchParams(location.search).get('room');if(param){mode='online';$('#code').value=param.toUpperCase();}render();
</script></body></html>
